<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>overlay</title>
<style>
  :root { --alpha: 0.7; }               /* transparansi kotak: 0.7 = 70% */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    pointer-events: none; user-select: none; -webkit-user-select: none; }
  #stage { position: absolute; top: 8px; left: 0; right: 0; display: flex; justify-content: center; }
  #toast { position: relative; width: 16px; height: 16px; border-radius: 8px; opacity: 0; overflow: hidden;
    background: rgba(18, 21, 26, var(--alpha)); border: 1px solid rgba(255, 255, 255, 0.14);
    transform: translateY(-30px) scale(.6); will-change: width, height, transform, opacity; }
  #inner { position: absolute; left: 50%; top: 0; height: 100%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; padding: 0 18px; white-space: nowrap; opacity: 0;
    transition: opacity .16s ease; color: #e7ebf0;
    font: 600 13px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; background: #4ecdc4; }
  #text { max-width: 400px; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div id="stage"><div id="toast"><div id="inner"><span id="dot"></span><span id="text"></span></div></div></div>
<!-- Logika ada di overlay.js (module) supaya Vite mengolah dynamic import dengan benar. -->
<script type="module" src="./overlay.js"></script>
</body>
</html>

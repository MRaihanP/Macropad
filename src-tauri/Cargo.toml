[package]
name = "macropad-configurator"
version = "0.9.0"
description = "A Tauri App"
authors = ["Muhammad Raihan Pradipta"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "macropad_configurator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
# Engine audio v2: decode metadata-aware (wav/mp3/ogg/flac/m4a), resample, queue.
symphonia = { version = "0.5.5", default-features = false, features = [
  "aac",
  "aiff",
  "alac",
  "isomp4",
  "mp3",
  "ogg",
  "vorbis",
  "flac",
  "wav",
  "pcm",
] }
rubato = "0.16.2"
crossbeam-channel = "0.5"
tauri-plugin-serialplugin = "2.17.1"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
# Mic DSP: RNNoise-based noise suppression (Fase 3).
nnnoiseless = "0.2.1"
# Dukungan async WinRT (IAsyncOperation bisa di-await).
# windows 0.61 memakai windows-future tanpa fitur std, jadi
# fitur std (dan modul future) harus diaktifkan di sini.
windows-future = "0.2"
# Hanya fitur yang benar-benar dipakai src/lib.rs. Devices_Bluetooth* dan
# Foundation* pernah ada tapi tidak direferensikan di mana pun - menambah waktu
# kompilasi tanpa fungsi. Kalau nanti BLE benar-benar dikerjakan (Phase 10),
# tambahkan kembali di sini.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_Storage_FileSystem",
  # i18n: GetUserDefaultLocaleName untuk deteksi bahasa Windows.
  "Win32_Globalization",
  # Phase 10 BLE: WinRT Bluetooth GATT APIs.
  "Devices_Bluetooth",
  "Devices_Bluetooth_GenericAttributeProfile",
  "Devices_Bluetooth_Advertisement",
  "Devices_Enumeration",
  "Foundation",
  "Storage_Streams",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

[dev-dependencies]
# Offline mic DSP harness (`examples/mic_offline.rs`) dan test WAV I/O.
hound = "3.5"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
